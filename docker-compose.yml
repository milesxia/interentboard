x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

x-app-env: &app-env
  TZ: ${TZ}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL}
  OLLAMA_CONTEXT_LENGTH: "8192"
  OLLAMA_KEEP_ALIVE: "-1"
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS}
  OLLAMA_JSON_RETRIES: ${OLLAMA_JSON_RETRIES}
  OLLAMA_PIN_MODEL: "true"
  LLAMA_ARG_LOAD_MODE: "mmap"
  LLAMA_ARG_FIT_TARGET: "0"
  LLAMA_ARG_MMPROJ_OFFLOAD: "true"
  MAX_SEARCH_ROUNDS: ${MAX_SEARCH_ROUNDS}
  MAX_QUERIES_PER_ROUND: ${MAX_QUERIES_PER_ROUND}
  MAX_RESULTS_PER_QUERY: ${MAX_RESULTS_PER_QUERY}
  MAX_SOURCES_PER_RUN: ${MAX_SOURCES_PER_RUN}
  MAX_TOTAL_AI_CHUNKS: ${MAX_TOTAL_AI_CHUNKS}
  MAX_AI_CHUNKS_PER_SOURCE: ${MAX_AI_CHUNKS_PER_SOURCE}
  VISUAL_ENABLED: ${VISUAL_ENABLED:-true}
  VISUAL_MAX_ASSETS_PER_SOURCE: ${VISUAL_MAX_ASSETS_PER_SOURCE:-2}
  VISUAL_MAX_ASSETS_PER_RUN: ${VISUAL_MAX_ASSETS_PER_RUN:-4}
  VISUAL_MAX_CANDIDATES_PER_SOURCE: ${VISUAL_MAX_CANDIDATES_PER_SOURCE:-10}
  VISUAL_MAX_IMAGE_BYTES: ${VISUAL_MAX_IMAGE_BYTES:-8388608}
  VISUAL_MIN_WIDTH: ${VISUAL_MIN_WIDTH:-280}
  VISUAL_MIN_HEIGHT: ${VISUAL_MIN_HEIGHT:-160}
  VISUAL_MIN_PIXELS: ${VISUAL_MIN_PIXELS:-100000}
  VISUAL_MAX_DIMENSION: ${VISUAL_MAX_DIMENSION:-1600}
  VISUAL_REQUEST_TIMEOUT_SECONDS: ${VISUAL_REQUEST_TIMEOUT_SECONDS:-30}
  VISUAL_PDF_MAX_PAGES: ${VISUAL_PDF_MAX_PAGES:-2}
  VISUAL_PDF_TEXT_THRESHOLD: ${VISUAL_PDF_TEXT_THRESHOLD:-350}
  VISUAL_PDF_SCALE: ${VISUAL_PDF_SCALE:-1.4}
  VISUAL_NUM_PREDICT: ${VISUAL_NUM_PREDICT:-1000}
  CHUNK_CHARS: ${CHUNK_CHARS}
  CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS}
  ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS}
  SEARXNG_URL: ${SEARXNG_URL}
  SCHEDULER_HOUR: ${SCHEDULER_HOUR}
  SCHEDULER_MINUTE: ${SCHEDULER_MINUTE}
  WEBSITE_WATCH_MINUTES: ${WEBSITE_WATCH_MINUTES}
  RUN_HEARTBEAT_INTERVAL_SECONDS: ${RUN_HEARTBEAT_INTERVAL_SECONDS:-15}
  RUN_HEARTBEAT_TTL_SECONDS: ${RUN_HEARTBEAT_TTL_SECONDS:-60}
  RUN_LOCK_TTL_SECONDS: ${RUN_LOCK_TTL_SECONDS:-90}
  RUN_QUEUE_MARKER_TTL_SECONDS: ${RUN_QUEUE_MARKER_TTL_SECONDS:-180}
  WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
  WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-50}
  RUNTIME_WATCHDOG_SECONDS: ${RUNTIME_WATCHDOG_SECONDS:-60}


  # INTERNETBOARD V4.10 SERIAL AI RUNTIME
  QUEUE_DEFAULT_RUN_SECONDS: "3600"
  STALL_PROGRESS_TIMEOUT_SECONDS: "1200"
  AUTO_RECOVERY_MAX_ATTEMPTS: "2"
  QUEUE_WATCHDOG_SECONDS: "60"
  QUEUE_RECOVERY_DELAY_SECONDS: "210"
  QUEUE_TASK_ID_TTL_SECONDS: "604800"
  AI_JOB_TTL_SECONDS: "86400"
  AI_QA_DEFAULT_SECONDS: "900"
  AI_SUMMARY_DEFAULT_SECONDS: "1200"


  # BEGIN INTERNETBOARD V4.11 SHANGHAI LOCAL ENV
  LOCAL_INTEL_TIME_RANGE: "day"
  LOCAL_INTEL_RESULTS_PER_QUERY: "3"
  LOCAL_INTEL_MAX_TOPICS: "12"
  LOCAL_INTEL_MAX_QUERIES_PER_TOPIC: "40"
  LOCAL_INTEL_FETCH_TIMEOUT_SECONDS: "20"
  LOCAL_INTEL_QUERY_DELAY_SECONDS: "0.35"
  LOCAL_INTEL_MIN_SCORE: "60"
  LOCAL_INTEL_MAX_CONTENT_CHARS: "12000"
  DAILY_REPORT_NOT_BEFORE_MINUTE: "15"
  # END INTERNETBOARD V4.11 SHANGHAI LOCAL ENV

services:
  postgres:
    image: postgres:16-alpine
    container_name: internetboard-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=1GB", "-c", "max_connections=50"]
    volumes:
      - ${APP_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internetboard]

  redis:
    image: redis:7.4-alpine
    container_name: internetboard-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--maxmemory-policy", "noeviction"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${APP_ROOT}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internetboard]

  ollama:
    image: ollama/ollama:latest
    pull_policy: always
    container_name: internetboard-ollama
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_FLASH_ATTENTION: "true"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_GPU_OVERHEAD: "0"
      OLLAMA_LOAD_TIMEOUT: 20m

      # FINAL UVM policy: do not cap GPU layers or reserve VRAM.
      # CUDA Unified Memory allows GPU allocations to spill into system RAM.
      GGML_CUDA_ENABLE_UNIFIED_MEMORY: "1"
      LLAMA_ARG_LOAD_MODE: "mmap"
      LLAMA_ARG_N_GPU_LAYERS: "all"
      LLAMA_ARG_FIT: "off"
      LLAMA_ARG_FIT_TARGET: "0"
      LLAMA_ARG_MMPROJ_OFFLOAD: "true"
      LLAMA_ARG_OP_OFFLOAD: "true"

      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ${APP_ROOT}/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [internetboard]

  model-init:
    image: ollama/ollama:latest
    pull_policy: always
    container_name: internetboard-model-init
    restart: "no"
    logging: *default-logging
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama show "$${OLLAMA_MODEL}" >/dev/null 2>&1 || ollama pull "$${OLLAMA_MODEL}"']
    networks: [internetboard]

  backend:
    image: milesxia/internetboard-backend:latest
    pull_policy: always
    container_name: internetboard-backend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    environment: *app-env
    volumes:
      - ${APP_ROOT}/data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [internetboard]

  worker:
    image: milesxia/internetboard-worker:latest
    pull_policy: always
    container_name: internetboard-worker
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ${APP_ROOT}/data:/data
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--prefetch-multiplier=1", "--without-mingle", "--without-gossip", "--without-heartbeat", "--concurrency=1", "--queues=research"]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [internetboard]

  # =========================================================
  # Monitor / Control Worker - V4.10.2
  # 独立监控卡死、恢复和控制任务，不参与重 AI 推理
  # 网络/卷/环境自动继承 Research Worker 的真实配置
  # =========================================================
  monitor:
    image: milesxia/internetboard-worker:latest
    pull_policy: always
    container_name: internetboard-monitor
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ${APP_ROOT}/data:/data
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --queues=control
      - --prefetch-multiplier=1
      - --without-mingle
      - --without-gossip
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [internetboard]


  # =========================================================
  # Shanghai Local Collector - V4.11
  # 市级/16区/街镇社区 Web 采集与 CPU 预过滤；不执行 Qwen 重推理。
  # 三乐专题额外定向 静安区 -> 江宁路街道 -> 三乐里 / In江宁。
  # =========================================================
  collector:
    image: milesxia/internetboard-worker:latest
    pull_policy: always
    container_name: internetboard-collector
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ${APP_ROOT}/data:/data
    command:
      - celery
      - -A
      - app.tasks.celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - --queues=collect
      - --prefetch-multiplier=1
      - --without-mingle
      - --without-gossip
      - --without-heartbeat
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 2>/dev/null | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [internetboard]

  # =========================================================
  # Monitor / Control Worker - V4.10.2
  # 独立监控卡死、恢复和控制任务，不参与重 AI 推理
  # 网络/卷/环境自动继承 Research Worker 的真实配置
  # =========================================================

  scheduler:
    image: milesxia/internetboard-scheduler:latest
    pull_policy: always
    container_name: internetboard-scheduler
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ${APP_ROOT}/data:/data
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO", "--schedule=/data/celerybeat-schedule"]
    networks: [internetboard]

  frontend:
    image: milesxia/internetboard-frontend:latest
    pull_policy: always
    container_name: internetboard-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [internetboard]

networks:
  internetboard:
    name: internetboard
    driver: bridge
