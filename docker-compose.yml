x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    container_name: internetboard-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - max_connections=50
    volumes:
      - ${APP_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internetboard]

  redis:
    logging: *default-logging
    image: redis:7.4-alpine
    container_name: internetboard-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    environment:
      TZ: ${TZ}
    volumes:
      - ${APP_ROOT}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internetboard]

  ollama:
    logging: *default-logging
    image: ollama/ollama:0.32.13
    container_name: internetboard-ollama
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "32"
      OLLAMA_FLASH_ATTENTION: "true"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_LOAD_TIMEOUT: 20m
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ${APP_ROOT}/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks: [internetboard]

  model-init:
    logging: *default-logging
    image: ollama/ollama:0.32.13
    container_name: internetboard-model-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL}\""]
    networks: [internetboard]

  backend:
    logging: *default-logging
    build:
      context: ./backend
    image: internetboard/backend:1.0.0
    container_name: internetboard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    environment: &app-env
      TZ: ${TZ}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${INTERNETBOARD_API_KEY}
      DATA_DIR: /data
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS}
      OLLAMA_JSON_RETRIES: ${OLLAMA_JSON_RETRIES}
      MAX_SEARCH_ROUNDS: ${MAX_SEARCH_ROUNDS}
      MAX_RESULTS_PER_QUERY: ${MAX_RESULTS_PER_QUERY}
      MAX_SOURCES_PER_RUN: ${MAX_SOURCES_PER_RUN}
      MAX_TOTAL_AI_CHUNKS: ${MAX_TOTAL_AI_CHUNKS}
      MAX_AI_CHUNKS_PER_SOURCE: ${MAX_AI_CHUNKS_PER_SOURCE}
      CHUNK_CHARS: ${CHUNK_CHARS}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS}
      SEARXNG_URL: ${SEARXNG_URL}
      SCHEDULER_HOUR: ${SCHEDULER_HOUR}
      SCHEDULER_MINUTE: ${SCHEDULER_MINUTE}
      WEBSITE_WATCH_MINUTES: ${WEBSITE_WATCH_MINUTES}
    volumes:
      - ${APP_ROOT}/data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [internetboard]

  worker:
    logging: *default-logging
    image: internetboard/backend:1.0.0
    container_name: internetboard-worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ${APP_ROOT}/data:/data
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "--prefetch-multiplier=1", "--max-tasks-per-child=10"]
    networks: [internetboard]

  scheduler:
    logging: *default-logging
    image: internetboard/backend:1.0.0
    container_name: internetboard-scheduler
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *app-env
    volumes:
      - ${APP_ROOT}/data:/data
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO", "--schedule=/data/celerybeat-schedule"]
    networks: [internetboard]

  frontend:
    logging: *default-logging
    build:
      context: ./frontend
    image: internetboard/frontend:1.0.0
    container_name: internetboard-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    networks: [internetboard]

networks:
  internetboard:
    name: internetboard
    driver: bridge
