services:
  intelboard:
    build: .
    image: intelboard:dev
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      ADMIN_PASSWORD: dev
      SESSION_SECRET: dev-secret-not-for-production
      MOCK_AI: "true"
      AUTO_PULL_MODEL: "false"
      OLLAMA_MODEL: auto
      SCHEDULE_HOUR: "3"
      SCHEDULE_MINUTE: "0"
