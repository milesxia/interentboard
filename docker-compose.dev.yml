services:
  internetboard:
    build: .
    image: internetboard:dev
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      ADMIN_PASSWORD: dev
      SESSION_SECRET: dev-secret-not-for-production
      MOCK_AI: "true"
      AUTO_PULL_MODEL: "false"
      OLLAMA_MODEL: qwen3.8:27b-q4_K_M
      OLLAMA_EXTRACT_MODEL: qwen3:4b-instruct-2507-q4_K_M
      SCHEDULE_HOUR: "3"
      SCHEDULE_MINUTE: "0"
