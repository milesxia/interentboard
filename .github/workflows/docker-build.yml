name: Build and Push InternetBoard

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  VERSION: latest

jobs:

  docker:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-backend:v1.0


      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-worker:v1.0


      - name: Build scheduler
        uses: docker/build-push-action@v6
        with:
          context: ./scheduler
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-scheduler:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-scheduler:v1.0


      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-frontend:v1.0
