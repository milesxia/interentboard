name: Build and Push InternetBoard

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build InternetBoard Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend worker scheduler
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-backend:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-worker:v1.0
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-scheduler:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-scheduler:v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/internetboard-frontend:v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
