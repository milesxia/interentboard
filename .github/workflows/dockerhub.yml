name: Build and Push InternetBoard

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Production Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python syntax check
        run: python -m compileall -q backend/app scripts/validate_production.py

      - name: Frontend JavaScript syntax check
        run: node --check frontend/app.js

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt

      - name: Import runtime modules
        env:
          DATABASE_URL: sqlite:////tmp/internetboard-ci.db
          REDIS_URL: redis://127.0.0.1:6379/0
          DATA_DIR: /tmp/internetboard-ci-data
        run: |
          PYTHONPATH=backend python -c "import app.runtime, app.tasks, app.pipeline, app.main; print('runtime imports PASS')"

      - name: Production invariants
        run: python scripts/validate_production.py

      - name: Compose validation
        run: docker compose --env-file .env.example config -q

  docker:
    name: Build InternetBoard Images
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve Docker Hub username
        id: dockerhub
        env:
          USER_FROM_VAR: ${{ vars.DOCKERHUB_USERNAME }}
          USER_FROM_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          USERNAME="${USER_FROM_VAR:-$USER_FROM_SECRET}"
          if [ -z "$USERNAME" ]; then
            echo "DOCKERHUB_USERNAME is missing from both Repository Variables and Repository Secrets" >&2
            exit 1
          fi
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend worker scheduler
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.username }}/internetboard-backend:latest
            ${{ steps.dockerhub.outputs.username }}/internetboard-backend:v1.0
            ${{ steps.dockerhub.outputs.username }}/internetboard-worker:latest
            ${{ steps.dockerhub.outputs.username }}/internetboard-worker:v1.0
            ${{ steps.dockerhub.outputs.username }}/internetboard-scheduler:latest
            ${{ steps.dockerhub.outputs.username }}/internetboard-scheduler:v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.username }}/internetboard-frontend:latest
            ${{ steps.dockerhub.outputs.username }}/internetboard-frontend:v1.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
