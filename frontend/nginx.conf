server {
    listen 80;
    server_name _;
    charset utf-8;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    # BEGIN INTERNETBOARD V4.7 NO-CACHE

    # app.js changed repeatedly during production hotfixes. Never allow an

    # old browser/proxy copy to drive a newer backend.

    location ~* \.(?:html|js|css|json)$ {

    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0, s-maxage=0" always;

    add_header Pragma "no-cache" always;

    add_header Expires "0" always;

    try_files $uri =404;

    }

    # END INTERNETBOARD V4.7 NO-CACHE


    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
